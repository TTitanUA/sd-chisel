[project]
name = "sd-chisel-backend"
version = "0.0.1"
description = "sd-chisel backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "sqlite-vec>=0.1.6",
  "numpy>=1.26",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.7",
]

[project.scripts]
db-init = "app.cli.init_db:main"
dev = "app.cli.dev:main"
dev-seed = "app.cli.dev_seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
